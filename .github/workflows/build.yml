# Сборка программы для Windows на серверах GitHub.
#
# * Любая загрузка изменений в ветку main - собрать и проверить (без релиза).
#   Готовая сборка лежит на странице запуска в разделе «Artifacts».
# * Вкладка Actions → «Сборка Windows» → «Run workflow» → ввести версию (например 1.5.0)
#   - собрать, проверить и ВЫПУСТИТЬ релиз: страница Releases с установщиком для скачивания.
# * Или отправить тег вида v1.5.0 - то же самое.
name: Сборка Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для релиза, например 1.5.0"
        required: true
        default: "1.5.0"

permissions:
  contents: write   # чтобы создать релиз

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      RELEASE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt

      - name: Установить PySide6 и PyInstaller
        run: python -m pip install -r packaging/requirements-build.txt

      - name: Записать версию
        shell: pwsh
        run: python packaging/stamp_version.py "${{ github.repository }}" "${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}"

      - name: Собрать VirtualExplorer.exe
        run: pyinstaller packaging/virtual_explorer.spec --noconfirm --clean --distpath dist --workpath build

      - name: Самопроверка собранной программы
        shell: pwsh
        run: |
          $out = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath "dist\VirtualExplorer\VirtualExplorer.exe" -ArgumentList "--self-test", "`"$out`"" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Программа зависла при самопроверке" }
          if (Test-Path $out) { Get-Content $out -Encoding utf8 } else { Write-Host "Отчёт не создан" }
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path $out -Pattern "SELFTEST OK" -Quiet)) {
            Get-ChildItem $env:TEMP -Directory -Filter "ve_selftest_*" | ForEach-Object {
              $log = Join-Path $_.FullName "errors.log"
              if (Test-Path $log) { Write-Host "--- $log"; Get-Content $log -Encoding utf8 }
            }
            throw "Самопроверка не прошла (код $($p.ExitCode))"
          }

      - name: Переносная версия (zip)
        shell: pwsh
        run: Compress-Archive -Path "dist\VirtualExplorer\*" -DestinationPath "dist\VirtualExplorer-$env:VER-portable.zip"

      - name: Собрать установщик
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VER" "packaging\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup не собрал установщик" }

      - name: Проверить установщик (установить, запустить, удалить)
        shell: pwsh
        run: |
          $setup = "dist\VirtualExplorer-$env:VER-Setup.exe"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Установка не прошла (код $($p.ExitCode))" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Virtual Explorer"
          $exe = Join-Path $dir "VirtualExplorer.exe"
          if (-not (Test-Path $exe)) { throw "После установки нет $exe" }
          $out = Join-Path $PWD "selftest-installed.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test", "`"$out`"" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Установленная программа зависла" }
          Get-Content $out -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "Установленная программа не прошла самопроверку" }
          $p = Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Удаление не прошло (код $($p.ExitCode))" }
          Write-Host "Установка, запуск и удаление - OK"

      - name: Сохранить сборку
        uses: actions/upload-artifact@v4
        with:
          name: VirtualExplorer-${{ env.VER }}
          path: |
            dist/VirtualExplorer-*-Setup.exe
            dist/VirtualExplorer-*-portable.zip
            selftest*.txt

      - name: Выпустить релиз
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Виртуальный проводник ${{ env.VER }}
          body_path: packaging/release_notes.md
          make_latest: "true"
          files: |
            dist/VirtualExplorer-${{ env.VER }}-Setup.exe
            dist/VirtualExplorer-${{ env.VER }}-portable.zip
